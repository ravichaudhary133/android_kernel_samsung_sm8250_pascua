name: pascua gts7xlwifi build

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build target (all, Image, dtbs, or dtbo.img)'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - Image
        - dtbs
        - dtbo.img
  push:
    tags:
      - 'v*'  # Trigger on version tags (e.g., v1.0.0)

env:
  ARTIFACT_DIR: kernel_artifacts_${{ github.run_number }}

jobs:
  buildkernel:
    runs-on: ubuntu-latest
    
    steps:
      # Checkout repository
      - uses: actions/checkout@v4
        with:
          submodules: recursive
        
      # Setup environment
      - name: Setup environment
        run: |
          sudo apt-get update && sudo apt-get install -y \
            bc flex git ccache automake lzop bison gperf build-essential \
            zip curl zlib1g-dev g++-multilib python3-networkx libxml2-utils \
            bzip2 libbz2-dev squashfs-tools pngcrush schedtool dpkg-dev \
            liblz4-tool optipng libssl-dev python-is-python3 python3-virtualenv \
            llvm clang lld

      # Initialize submodules
      - name: Initialize submodules
        run: git submodule update --init --recursive

      # Create artifact directory with unique name
      - name: Create artifact directory
        run: |
          echo "Creating artifact directory: ${{ env.ARTIFACT_DIR }}"
          mkdir -p "${{ env.ARTIFACT_DIR }}" || {
            echo "Failed to create directory, trying with sudo..."
            sudo mkdir -p "${{ env.ARTIFACT_DIR }}" && sudo chown -R runner:runner "${{ env.ARTIFACT_DIR }}"
          }
          ls -la

      # Rest of your steps...
      - name: Set permissions
        run: chmod +x gts7xlwifi.sh

      - name: Build kernel
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHATID: ${{ secrets.TELEGRAM_CHATID }}
        run: |
          sudo bash gts7xlwifi.sh ${{ github.event.inputs.build_target }}

      # Prepare artifacts
      - name: Prepare artifacts
        run: |
          if [[ -f out/arch/arm64/boot/Image.gz-dtb ]]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          elif [[ -f out/arch/arm64/boot/Image-dtb ]]; then
            cp out/arch/arm64/boot/Image-dtb AnyKernel3/Image-dtb
          elif [[ -f out/arch/arm64/boot/Image.gz ]]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          elif [[ -f out/arch/arm64/boot/Image ]]; then
            cp out/arch/arm64/boot/Image AnyKernel3/Image
          fi
          if [[ -f out/arch/arm64/boot/dtbo.img ]]; then
            cp out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img
          fi

          # Create AnyKernel zip
          cd AnyKernel3
          zip -r9 AnyKernel.zip *
          mv AnyKernel.zip ../${{ env.ARTIFACT_DIR }}/

      # Upload kernel artifact (for workflow_dispatch)
      - name: Upload kernel to artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: pascua_kernel
          path: AnyKernel3/*

      # Create release and upload assets (for tag push)
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: "Kernel build for ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: |
            ${{ env.ARTIFACT_DIR }}/AnyKernel.zip

      # Upload AnyKernel to release
      - name: Upload AnyKernel to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.ARTIFACT_DIR }}/AnyKernel.zip
          asset_name: gts7xlwifi-${{ github.ref_name }}.zip
          asset_content_type: application/zip