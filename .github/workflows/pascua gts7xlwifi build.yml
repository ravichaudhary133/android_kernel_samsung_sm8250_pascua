name: pascua gts7xlwifi build

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build target (all, Image, dtbs, or dtbo.img)'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - Image
        - dtbs
        - dtbo.img
  push:
    tags:
      - 'v*'

env:
  ARTIFACT_DIR: kernel_artifacts_${{ github.run_number }}

jobs:
  buildkernel:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Setup environment
      - name: Setup environment
        run: |
          sudo apt-get update && sudo apt-get install -y \
            bc flex git ccache automake lzop bison gperf build-essential \
            zip curl zlib1g-dev g++-multilib python3-networkx libxml2-utils \
            bzip2 libbz2-dev squashfs-tools pngcrush schedtool dpkg-dev \
            liblz4-tool optipng libssl-dev python-is-python3 python3-virtualenv \
            llvm clang lld

      # Initialize submodules
      - name: Initialize submodules
        run: git submodule update --init --recursive

      # Create artifact directory
      - name: Create artifact directory
        run: mkdir -p "${{ env.ARTIFACT_DIR }}"

      # Set permissions for build script
      - name: Set permissions
        run: chmod +x gts7xlwifi.sh

      # Build kernel
      - name: Build kernel
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHATID: ${{ secrets.TELEGRAM_CHATID }}
        run: |
          sudo bash gts7xlwifi.sh ${{ github.event.inputs.build_target || 'all' }}

      # Prepare artifacts
      - name: Prepare artifacts
        run: |
          # Copy kernel image
          if [[ -f out/arch/arm64/boot/Image.gz-dtb ]]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          elif [[ -f out/arch/arm64/boot/Image-dtb ]]; then
            cp out/arch/arm64/boot/Image-dtb AnyKernel3/Image-dtb
          elif [[ -f out/arch/arm64/boot/Image.gz ]]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          elif [[ -f out/arch/arm64/boot/Image ]]; then
            cp out/arch/arm64/boot/Image AnyKernel3/Image
          fi

          # Copy dtbo if exists
          if [[ -f out/arch/arm64/boot/dtbo.img ]]; then
            cp out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img
          fi

          # Create AnyKernel zip
          cd AnyKernel3
          zip -r9 kernel.zip *
          mv kernel.zip ../${{ env.ARTIFACT_DIR }}/kernel.zip
          cd ..

      # Upload build artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: ${{ env.ARTIFACT_DIR }}/*

      # Set timestamped release tag and name
      - name: Set release tag and name
        id: taginfo
        run: |
          echo "tag=gts7xl-pascua_stock-${{ github.run_number }}-$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"
          echo "name= Pascua Stock Kernel Build #${{ github.run_number }} - $(date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"

      # Create GitHub Release for every run
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.taginfo.outputs.tag }}
          name: ${{ steps.taginfo.outputs.name }}
          body: |
            Kernel build run number: ${{ github.run_number }}
            Triggered by: ${{ github.event_name }}
            Timestamp: ${{ steps.taginfo.outputs.name }}
          draft: false
          prerelease: true

      # Upload release asset (kernel.zip)
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.ARTIFACT_DIR }}/kernel.zip
          asset_name: gts7xlwifi-${{ steps.taginfo.outputs.tag }}.zip
          asset_content_type: application/zip
